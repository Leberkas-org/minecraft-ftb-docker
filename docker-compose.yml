# Minecraft modpack server.
#
#   docker compose up -d
#   docker compose logs -f
#
# First start downloads nothing - the whole modpack is baked into the image -
# but generating the world takes a few minutes.

services:
  minecraft:
    image: ghcr.io/leberkas-org/minecraft_atm_10:latest
    container_name: minecraft

    environment:
      # By setting this you accept the Minecraft EULA: https://aka.ms/MinecraftEULA
      EULA: "true"
      MEMORY: 10G
      MOTD: All the Mods 10

      # Remote console. Bind the port below to localhost if you enable it.
      # ENABLE_RCON: "true"
      # RCON_PASSWORD: change-me

    ports:
      - "25565:25565"
      # - "127.0.0.1:25575:25575"

    # World, logs, backups, server.properties, ops and whitelist all live here.
    volumes:
      - ./data:/data

    # A modded server needs time to flush chunks; killing it early corrupts them.
    stop_grace_period: 120s
    restart: unless-stopped
