name: update-packs

# Checks daily whether any pack has a newer release and, if so, opens one pull
# request per pack bumping just that pack file. Merging the PR is what builds
# and publishes - see build.yml.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write        # creating the label below

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - uses: actions/checkout@v7
      # Driven by the contents of packs/, so a new pack file needs no edit here.
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          json=$(for f in packs/*.env; do basename "$f" .env; done \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packs=$json" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.discover.outputs.packs) }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for a newer release
        id: check
        shell: pwsh
        run: ./tools/update-pack.ps1 -Pack ${{ matrix.pack }}

      # Whether the labels API auto-creates an unknown label is undocumented, and
      # this job runs unattended on a schedule, so create it explicitly rather
      # than find out the hard way. --force makes it idempotent.
      - name: Ensure the modpack-update label exists
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create modpack-update \
            --color 1d76db \
            --description 'Automated modpack version bump' \
            --force

      # create-pull-request opens the PR, updates it in place if the pack moves
      # again before merge, and does nothing when there is no change.
      - name: Open pull request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: modpack-update/${{ matrix.pack }}
          delete-branch: true
          commit-message: |
            chore(${{ matrix.pack }}): update to ${{ steps.check.outputs.version_name }}

            ${{ steps.check.outputs.previous }} -> ${{ steps.check.outputs.version }}
          title: 'chore(${{ matrix.pack }}): update to ${{ steps.check.outputs.version_name }}'
          labels: modpack-update
          body: |
            `${{ steps.check.outputs.pack_name }}` has a newer release.

            | | version id | tag |
            | --- | --- | --- |
            | from | `${{ steps.check.outputs.previous }}` | `${{ steps.check.outputs.previous_name }}` |
            | to | `${{ steps.check.outputs.version }}` | `${{ steps.check.outputs.tag }}` |

            **Nothing is built yet.** Add the **`build`** label to this PR to
            build the image and boot the server until it logs `Done (` — that
            takes ~25 minutes, so it only runs when you ask for it.

            Merging publishes `:latest`, `:pack-version-${{ steps.check.outputs.version }}`
            and `:${{ steps.check.outputs.tag }}` to GHCR. The master run boots
            the server too, so a pack that will not start fails before it is
            pushed either way.
